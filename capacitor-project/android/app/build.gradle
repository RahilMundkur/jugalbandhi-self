        // "App interactions" and "Device or other IDs" are genuinely
        // optional too, for an accurate Play Console Data Safety
        // declaration. Renamed the sidebar toggle to "Crash & usage
        // reports" to reflect the wider scope.
        // 30 = replaced the app icon (new yin-yang portrait artwork). Regenerated
        // all Android launcher assets from the new source: legacy square icons
        // (mipmap-*/ic_launcher.png), circular-masked icons (ic_launcher_round.png),
