apply plugin: 'com.android.application'

// Load signing config from key.properties (gitignored — contains passwords).
// If the file isn't present, release builds will fall back to debug signing
// so day-to-day Gradle work doesn't break.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.rahilmundkur.jugalbandhiself"
    compileSdk = rootProject.ext.compileSdkVersion
    // Play Asset Delivery: four on-demand packs for the EN/FR/HI/TH audio.
    // Each pack is its own Gradle module declared in settings.gradle and
    // lives under audio-packs-android/. English moved on-demand (was baked
    // into the base APK) to shrink the base install size.
    assetPacks = [':audio_en', ':audio_fr', ':audio_hi', ':audio_th', ':audio_es', ':audio_zh', ':audio_zh_tw']
    defaultConfig {
        applicationId "com.rahilmundkur.jugalbandhiself"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bubblewrap shipped at versionCode 11 / versionName "3".
        // First Capacitor build was 12 / "3.1" but Play reserved that
        // versionCode on a draft upload, so used 13.
        // 14 = same 3.1 release, rebuilt with the first yin-yang app icon.
        // 15 = same 3.1 release, rebuilt with the clean text-free yin-yang icon.
        // 16 = same 3.1 release, rebuilt with the Ch.1/10/21/24 audio-splice
        // fixes, per-paragraph play button rework (tap-to-reveal, two
        // independent buttons, hidden on non-audio languages), and the
        // prev/next chapter nav label redesign ("Chapter N: Title").
        // 17 = rebuild of 16 to pick up changes that were reportedly missing
        // from the v16 internal-testing install.
        // 18 = all audio re-encoded to 64kbps mono (was 128kbps for en/fr/hi
        // and the 8 chapter-1/10/21/24 splice files in th; th's other 278
        // native files stay at their original 32kbps). Cuts base download
        // roughly in half and shrinks the fr/hi on-demand packs similarly.
        // 19 = same build as 18; version code 18 was already reserved by
        // Play (an earlier upload attempt, even though not the live release).
        // 20 = replaced the indeterminate audio-pack download spinner with a
        // real Play Store-style progress ring, driven by actual
        // bytesDownloaded/bytesTotal from the native AudioPack Kotlin plugin
        // (new 'packProgress' event).
        // 21 = same build as 20, plus the slow-flashing "Downloading…" label
        // added right after (no functional/native change, web assets only).
        // 22 = enlarged the download progress ring (~30px) and added the
        // actual percentage number centered inside it (web assets only).
        // 23 = moved English audio to an on-demand Play Asset Delivery pack
        // (was baked into the base APK). New :audio_en Gradle module added
        // to assetPacks; base install size drops by the ~66MB English audio.
        // 24 = added an in-app backup/restore feature (Export backup /
        // Import backup, sidebar). Exports reading progress, highlights,
        // and settings to a JSON file via the new @capacitor/filesystem +
        // existing @capacitor/share; import re-reads that JSON via a file
        // picker. No manifest change needed — FileProvider/cache-path was
        // already configured.
        // 25 = accessibility pass (web assets only, no native change):
        // aria-label on icon-only/ambiguous buttons (autoscroll, focus-exit,
        // random-chapter, close ✕ buttons), role="dialog"/aria-modal/
        // aria-labelledby on the note/audio-pack/language modals, the
        // search panel, and the completion overlay; aria-pressed kept in
        // sync on the auto-scroll and side-by-side toggle buttons; the
        // completion "Close" control changed from a bare clickable <div>
        // to a real, keyboard-reachable <button>.
        // 26 = Crashlytics/Analytics scaffolding. New :crash-report-bridge
        // Gradle module + CrashReportPlugin.kt exposes logMessage/
        // recordError to the WebView; _warn()/_err() and a global
        // window.onerror/unhandledrejection handler now feed it. Entirely
        // inert (safe no-op) until google-services.json is dropped into
        // android/app/ from a real Firebase project — see the conditional
        // apply-plugin block above and CrashReportPlugin.kt's try/catch
        // guards. Not testable in this environment; needs a real device/
        // Play Console build with that file present to confirm crashes
        // actually show up in the Firebase console.
        // 27 = Export backup no longer includes the ElevenLabs/DeepL API
        // keys in plaintext (web assets only) — the backup file is meant
        // to be shareable without leaking credentials. Also updated
        // privacy-policy.html to disclose Crashlytics/Analytics data
        // collection (not part of the app bundle, hosted separately).
        // 28 = added a "Crash reports: On/Off" sidebar toggle so readers can
        // opt out of Crashlytics/Analytics at runtime (web assets only).
        // Calls CrashReportPlugin.setEnabled(), which was scaffolded in v26
        // but unused until now; also applied once on every launch so the
        // reader's last choice is restored.
        // 29 = the crash-reporting toggle now also disables Firebase
        // Analytics collection (CrashReportPlugin.setEnabled() calls
        // FirebaseAnalytics.setAnalyticsCollectionEnabled() alongside
